services:
  frameflow-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frameflow-engine
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_DIR=/app/storage
      - BASE_URL=http://localhost:8000
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadminpassword}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-frameflow-deliverables}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY:-}
      - ENABLE_MOCK_FOOTAGE=true
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - ASR_PROVIDER=${ASR_PROVIDER:-faster-whisper}
      - TTS_PROVIDER=${TTS_PROVIDER:-gtts}
      - RELEVANCE_SCORER=${RELEVANCE_SCORER:-clip}
    depends_on:
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # MinIO S3-Compatible Local Object Storage
  minio:
    image: minio/minio:latest
    container_name: frameflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadminpassword}
    command: server /data --console-address ":9001"
    volumes:
      - ./storage/minio_data:/data
    restart: unless-stopped

  # MinIO Bucket Auto-Provisioning Helper
  minio-init:
    image: minio/mc:latest
    container_name: frameflow-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadminpassword};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_NAME:-frameflow-deliverables};
      /usr/bin/mc anonymous set download local/${S3_BUCKET_NAME:-frameflow-deliverables};
      exit 0;
      "

  # Zero-API-Key Automated Test Suite Container
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frameflow-tests
    environment:
      - PYTHONPATH=/app/backend
      - ASR_PROVIDER=mock
      - TTS_PROVIDER=mock
      - RELEVANCE_SCORER=mock
      - ENABLE_MOCK_FOOTAGE=true
      - STORAGE_DIR=/app/storage
    command: ["pytest", "backend/tests", "-v"]
